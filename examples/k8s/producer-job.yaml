# One-off producer: publishes DEVKIT_PRODUCER_COUNT messages to RabbitMQ or
# Redis (DEVKIT_PRODUCER_MODE). Applied by "devkit test keda" and
# "devkit examples produce".
apiVersion: batch/v1
kind: Job
metadata:
  name: ${DEVKIT_PRODUCER_NAME}
  namespace: ${DEVKIT_EXAMPLES_NAMESPACE}
  labels:
    app.kubernetes.io/name: producer
    app.kubernetes.io/part-of: minikube-devkit
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: producer
    spec:
      restartPolicy: Never
      containers:
        - name: producer
          image: ${DEVKIT_EXAMPLES_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: MODE
              value: ${DEVKIT_PRODUCER_MODE}
            - name: COUNT
              value: "${DEVKIT_PRODUCER_COUNT}"
          envFrom:
            - secretRef:
                name: examples-credentials
