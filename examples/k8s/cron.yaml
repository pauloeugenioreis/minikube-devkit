# Time-based autoscaling: 2 replicas during minutes 0-10, 20-30 and 40-50 of
# every hour, 0 otherwise. Uses the tiny "pause" image; only the scaling matters.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cron-demo
  namespace: ${DEVKIT_EXAMPLES_NAMESPACE}
  labels:
    app.kubernetes.io/name: cron-demo
    app.kubernetes.io/part-of: minikube-devkit
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cron-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cron-demo
        app.kubernetes.io/part-of: minikube-devkit
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: cron-demo
  namespace: ${DEVKIT_EXAMPLES_NAMESPACE}
spec:
  scaleTargetRef:
    name: cron-demo
  minReplicaCount: 0
  maxReplicaCount: 2
  triggers:
    - type: cron
      metadata:
        timezone: Etc/UTC
        start: "0,20,40 * * * *"
        end: "10,30,50 * * * *"
        desiredReplicas: "2"
