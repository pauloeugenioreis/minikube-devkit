apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: ${DEVKIT_NAMESPACE}
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: minikube-devkit
spec:
  selector:
    app.kubernetes.io/name: postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: ${DEVKIT_NAMESPACE}
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: minikube-devkit
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/part-of: minikube-devkit
    spec:
      containers:
        - name: postgresql
          image: ${DEVKIT_IMAGE_POSTGRESQL}
          envFrom:
            - secretRef:
                name: postgresql-credentials
          ports:
            - name: postgresql
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            # The parent directory works for PostgreSQL 18+ (versioned PGDATA)
            # and for older images (PGDATA=/var/lib/postgresql/data).
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
