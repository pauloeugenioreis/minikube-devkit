apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: ${DEVKIT_NAMESPACE}
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: minikube-devkit
spec:
  selector:
    app.kubernetes.io/name: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: ${DEVKIT_NAMESPACE}
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: minikube-devkit
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/part-of: minikube-devkit
    spec:
      containers:
        - name: mysql
          image: ${DEVKIT_IMAGE_MYSQL}
          envFrom:
            - secretRef:
                name: mysql-credentials
          ports:
            - name: mysql
              containerPort: 3306
          # The first start initializes the data directory with networking
          # disabled, so TCP probes only pass once MySQL is really serving.
          startupProbe:
            exec:
              command: ["sh", "-c", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent']
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-c", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent']
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent']
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
