apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: ${DEVKIT_NAMESPACE}
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: minikube-devkit
spec:
  selector:
    app.kubernetes.io/name: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: ${DEVKIT_NAMESPACE}
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: minikube-devkit
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/part-of: minikube-devkit
    spec:
      containers:
        - name: mongodb
          image: ${DEVKIT_IMAGE_MONGODB}
          # Keep the WiredTiger cache small; the default is 50% of the node RAM.
          args: ["--wiredTigerCacheSizeGB", "0.25"]
          envFrom:
            - secretRef:
                name: mongodb-credentials
          ports:
            - name: mongodb
              containerPort: 27017
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
