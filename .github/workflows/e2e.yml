name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Bring everything up
        run: ./devkit.sh up --yes --services all
      - name: Smoke tests
        run: ./devkit.sh test smoke
      - name: KEDA autoscaling (0 -> N -> 0)
        run: ./devkit.sh test keda
      - name: Status
        if: always()
        run: ./devkit.sh status || true
      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          kubectl --context devkit get all -A > diagnostics/resources.txt 2>&1 || true
          kubectl --context devkit get events -A --sort-by=.lastTimestamp > diagnostics/events.txt 2>&1 || true
          minikube logs -p devkit > diagnostics/minikube.txt 2>&1 || true
          cp -r log diagnostics/ || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics
          path: diagnostics/
